<style>
/* VOICE  차분한 실무 상황판. 함께 매주 여는 오픈 준비 본부 (흰 바탕 + 구분 색)
   IDEA   현장 사무실 벽의 공정표 + 결정 대장
   PICTURE 대시보드는 결정 대장, 기획·예산은 공정표(간트)가 그림
   COLOUR 디자인북 재료: 그레이지 스톤 바탕, 흰 패널, 짙은 먹색, 더스티 로즈 포인트. 간트는 기존 엑셀 범례색
   TYPE   Pretendard 본문 + Cormorant Garamond 로고
   LAYOUT 4칸 요약 → 결정 대장(2/3) + 이번 주(1/3). 기획·예산은 요약 → 간트 → 차트 → 표 */
:root{color-scheme:light;
--bg:#F6F7F8;--panel:#FFFFFF;--ink:#1F2328;
--mute:#6B7280;--line:#E5E7EB;--soft:#F3F4F6;

--c-core:#C4614F;--c-base:#4F6488;--c-cont:#5F9468;--c-pr:#D9A03F;--c-evt:#8C6A9E;--ok:#6E7F62}

@font-face{font-family:'Pretendard Variable';src:url(fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920;font-display:swap}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-0.01em;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:20px max(16px,3vw) 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:16px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:600;letter-spacing:.08em}.brand span{font-size:13px;color:var(--mute)}
nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}

nav a.on{background:var(--ink);color:var(--bg)}nav a.off{opacity:.45;pointer-events:none}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.who select,.who button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer}
.mode{font-size:13px;color:var(--mute);background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}

.big{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--mute);margin-top:6px}
.date{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 8px;font-size:14px;min-height:36px}
.row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:12px}.head h2{margin:0;font-size:18px;white-space:nowrap}.head .sub{margin:0}
.dec{list-style:none;margin:0;padding:0}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--oak);margin-right:6px;vertical-align:1px}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px;padding:4px 6px;min-height:32px}

.add{display:grid;grid-template-columns:110px minmax(0,1fr) 140px auto;gap:8px;margin:0 0 14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.add textarea{grid-column:1/-1;resize:vertical;min-height:44px}
.add input,.add select,.add textarea{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:16px;font-family:inherit;color:inherit}

.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:720px;gap:12px;margin-bottom:12px}

.scen b{display:block;text-align:right;font-size:15px;padding:5px 0}

.g tfoot td{background:var(--soft);font-weight:700;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute);margin:10px 2px 0}
.legend span{display:flex;align-items:center;gap:6px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.hb{display:grid;grid-template-columns:76px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.hb .bar{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}.hb .bar i{display:block;height:100%;border-radius:4px}
.hb b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:180px;padding-top:20px}
.vb div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.vb i{width:70%;max-width:40px;background:var(--c-base);border-radius:4px 4px 0 0;min-height:2px}
.vb span{font-size:12px;color:var(--mute)}.vb b{font-size:12px;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);padding:8px 6px}
.t td{border-bottom:1px solid var(--line);padding:8px 6px}.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tfoot td{font-weight:700;border-bottom:0}
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0/.18);padding:12px;width:230px}
.pop p{margin:0 0 8px;font-size:13px;color:var(--mute)}.pop input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px;font-size:16px;text-align:right}
.pop .acts{display:flex;gap:6px;margin-top:8px}.pop .acts .btn{flex:1;padding:6px;min-height:36px;font-size:13px}
.cadd{display:grid;grid-template-columns:minmax(0,2fr) auto minmax(0,1fr) minmax(0,.9fr) minmax(0,1.1fr) auto;gap:8px;align-items:center}
.chs{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}.chs label{display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}.chs input{width:16px;height:16px;accent-color:var(--rose)}
.fmt{font-size:13px;color:var(--mute);font-weight:600}.kc .fmt{display:block;font-size:12px;margin-bottom:4px}
.cadd input,.cadd select,.fbar input:not([type=checkbox]),.fbar select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:15px;min-height:42px;width:100%}
.ctop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 12px}.ctop h2{margin:0;font-size:20px}
.seg{margin-left:auto;display:flex;gap:6px}.seg button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 18px;font-weight:600;cursor:pointer;min-height:40px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.fbar input{max-width:280px}.fbar select{max-width:180px}
.fbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);white-space:nowrap}.fbar input[type=checkbox]{width:18px;height:18px;accent-color:var(--rose)}
.counts{font-size:13px;color:var(--mute);margin-left:auto}
table.cl{width:100%;border-collapse:collapse;font-size:15px}
.cl th{text-align:left;font-size:13px;font-weight:600;color:var(--mute);background:var(--soft);padding:12px 14px}
.cl th:first-child{border-radius:10px 0 0 0}.cl th:last-child{border-radius:0 10px 0 0}
.cl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.cl td.tt{font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}

.st-기획{background:#F1F2F4;color:#5B6270}.st-진행{background:#F3E5D3;color:#8A5E2E}.st-완료{background:#E3EADF;color:#4F6646}
.due{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}.due .chip{margin-left:6px}
.dd-soon{background:#F6E2DD;color:#9B4F43}.dd-later{background:#F1F2F4;color:#5B6270}.dd-past{background:#EDE7E0;color:#9A8F84}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col h3{margin:2px 4px 6px;font-size:14px;display:flex;align-items:center;gap:8px}.col h3 span{color:var(--mute);font-weight:500}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kc b{display:block;font-size:14px;line-height:1.4;margin-bottom:8px}.kc .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.typ{display:inline-block;width:8px;height:8px;border-radius:2px}
.dseg{margin:0 0 6px;justify-content:flex-start}.dseg button{padding:6px 14px;min-height:36px;font-size:13px}
.turn{font-style:normal;font-size:11px;font-weight:700;background:var(--rose);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:1px}

.dir{font-size:12px;color:var(--oak);margin-top:4px}.dir a{color:var(--rose)}
.dadd{display:grid;grid-template-columns:auto minmax(0,2fr) minmax(0,.8fr) auto;gap:8px;align-items:center}
.dadd input,.dadd select,.dlist>input{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:15px;min-height:42px;width:100%}

.docs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:12px;margin-top:12px;align-items:start}
.dlist{display:flex;flex-direction:column;gap:6px;padding:12px}.dlist>input{margin-bottom:6px}

.dadd.txt{grid-template-columns:minmax(0,2fr) minmax(0,.8fr) auto}.dadd textarea,.kedit textarea{grid-column:1/-1;min-height:160px;resize:vertical;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;line-height:1.6;color:inherit}
.kedit{display:flex;flex-direction:column;gap:8px}.kedit input{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:16px;font-weight:600}.kedit textarea{min-height:360px}.kedit .btn{align-self:flex-end}

.lrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px;font-size:14px;cursor:pointer}.lrow:hover{background:var(--soft)}.lrow input{width:16px;height:16px;accent-color:var(--rose)}.lrow .tag{margin:0}
.dview .lbox{margin:0 0 12px}

.hview{width:100%;height:600px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}

  app.querySelectorAll('[data-ced]').forEach(e=>e.onclick=()=>{editCon=e.dataset.ced;draw();const t=app.querySelector('.etl');if(t){t.focus();t.select()}});
  app.querySelectorAll('[data-kced]').forEach(e=>e.onclick=()=>{editCon=e.dataset.kced;view='list';draw();const t=app.querySelector('.etl');if(t){t.focus();t.scrollIntoView({block:'center'})}});
  const cs=app.querySelector('[data-csave]');if(cs){const row=cs.closest('tr');const save=()=>{const chs=[...row.querySelectorAll('.ech:checked')].map(x=>x.value);if(!chs.length){row.querySelector('.chs').style.outline='2px solid var(--rose)';return}const id=cs.dataset.csave;editCon=null;api.updateContent(id,{note:row.querySelector('.enote').value.trim(),title:row.querySelector('.etl').value.trim()||'제목 없음',channels:chs,format:row.querySelector('.efm').value})};
    cs.onclick=save;row.querySelector('.etl').onkeydown=e=>{if(e.key==='Enter')save();if(e.key==='Escape'){editCon=null;draw()}};row.querySelector('[data-ccancel]').onclick=()=>{editCon=null;draw()}}
  app.querySelectorAll('[data-due]').forEach(e=>e.onchange=()=>api.updateContent(e.dataset.due,{due:e.value}));
  app.querySelectorAll('[data-cdel]').forEach(e=>e.onclick=()=>armDelete(e,()=>api.deleteContent(e.dataset.cdel)));
  const f=app.querySelector('#cf');if(f)f.onsubmit=ev=>{ev.preventDefault();const t=f.querySelector('#ct').value.trim();if(!t)return;const chs=[...f.querySelectorAll('.chs input:checked')].map(x=>x.value);if(!chs.length){f.querySelector('.chs').style.outline='2px solid var(--rose)';return}api.addContent({note:f.querySelector('#cnote').value.trim(),title:t,channels:chs,format:f.querySelector('#cfm').value,status:f.querySelector('#cst').value,due:f.querySelector('#cdue').value})};
}

// ---------- 자료 ----------
const mdHtml=(t,br)=>{try{return window.DOMPurify&&window.marked?DOMPurify.sanitize(marked.parse(t||'',{breaks:!!br})):'<div style="white-space:pre-wrap">'+esc(t)+'</div>'}catch(e){return '<div style="white-space:pre-wrap">'+esc(t)+'</div>'}};
let docQ='',upMode='md',editing=false,lboxOpen=false;
// HTML 자료는 격리된 프레임(sandbox, 다른 출처)에서만 실행: 대시보드 데이터·로그인에 접근 불가
const htmlDoc=b=>{const inj='<base target="_blank"><script>(function(){function s(){parent.postMessage({pumanH:Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0)},"*")}addEventListener("load",s);addEventListener("resize",s);setTimeout(s,300);setTimeout(s,1500)})()<\/script>';return /<head[^>]*>/i.test(b)?b.replace(/<head[^>]*>/i,m=>m+inj):inj+b};
addEventListener('message',e=>{const f=document.getElementById('hview');if(f&&e.source===f.contentWindow&&e.data&&typeof e.data.pumanH==='number'){f.style.height=Math.min(Math.max(e.data.pumanH+8,300),20000)+'px'}});
const linksOf=k=>Array.isArray(k.links)?k.links:(k.link?[k.link]:[]);
const decChecks=(list,sel,cls)=>{const groups=ORGS().map(o=>{const its=list.filter(d=>d.to===o&&(d.status!=='confirmed'||sel.includes(d.id)));return its.length?`<div class="lgrp"><span class="lgh">${esc(o)} 확인 대기</span>${its.map(d=>`<label class="lrow"><input type="checkbox" class="${cls}" value="${esc(d.id)}"${sel.includes(d.id)?' checked':''}><span class="tag">${esc(d.cat)}</span>${esc(d.title)}</label>`).join('')}</div>`:''}).join('');return groups||'<p class="sub" style="margin:0">연결할 결정 항목이 없어요.</p>'};
const decOpts=(list,sel)=>ORGS().map(o=>{const its=list.filter(d=>d.to===o&&(d.status!=='confirmed'||d.id===sel));return its.length?`<optgroup label="${esc(o)} 확인 대기">${its.map(d=>`<option value="${esc(d.id)}"${d.id===sel?' selected':''}>[${esc(d.cat)}] ${esc(d.title)}</option>`).join('')}</optgroup>`:''}).join('');
function docs(){
  const all=(S.docs||[]).slice().sort((a,b)=>b.createdAt-a.createdAt);
  const list=all.filter(k=>!docQ||(k.title+(k.kind==='html'?String(k.body).replace(/<[^>]+>/g,' '):k.body)).toLowerCase().includes(docQ.toLowerCase()));
  if(!openDoc||!all.find(k=>k.id===openDoc))openDoc=list[0]?.id||null;
  const cur=all.find(k=>k.id===openDoc);
  const D=S.decisions.map(normD).filter(d=>d.status!=='confirmed');
  const canEd=k=>isAdmin()||nameOf(k.from)===me.id;
  const dt=ms=>{const d=new Date(ms);return `${String(d.getFullYear()).slice(2)}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};
  shell('docs',`
  <div class="card"><div class="head"><h2>자료 올리기</h2><p class="sub">md·HTML 파일을 올리거나, 카톡·메모 내용을 붙여넣어 바로 쓸 수 있어요</p></div>
   <div class="seg dseg"><button data-up="md" class="${upMode==='md'?'on':''}">md 파일</button><button data-up="html" class="${upMode==='html'?'on':''}">HTML 파일</button><button data-up="text" class="${upMode==='text'?'on':''}">직접 쓰기</button></div>
   <form class="dadd${upMode==='text'?' txt':''}" id="kf">${upMode!=='text'?`<label class="file"><input type="file" id="kfile" accept="${upMode==='html'?'.html,.htm,text/html':'.md,.markdown,.txt,text/markdown,text/plain'}"><span id="kfname">${upMode==='html'?'HTML 파일 고르기':'md 파일 고르기'}</span></label>`:''}
    <input id="kt" placeholder="${upMode==='text'?'제목':'제목 (비우면 파일의 제목)'}" aria-label="제목"${upMode==='text'?' required':''}><select id="kc" aria-label="분류">${DOC_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
    <button class="btn">올리기</button>
    ${upMode==='text'?'<textarea id="kbody" placeholder="내용을 쓰거나 붙여넣어 주세요. 줄바꿈은 그대로 보여요." aria-label="내용" required></textarea>':''}</form>
   <details class="lbox"><summary>결정 항목 연결하기 <span class="sub">(선택 · 이 자료를 근거로 붙일 항목)</span></summary>${decChecks(D,[],'kl')}</details>
   <p class="sub" id="kmsg"></p></div>
  <section class="docs">
   <div class="card dlist"><input id="kq" placeholder="자료 검색" value="${esc(docQ)}" aria-label="자료 검색">
    ${list.length?list.map(k=>{const ln=S.decisions.find(d=>linksOf(k).includes(d.id));return `<button class="ditem${k.id===openDoc?' on':''}" data-k="${esc(k.id)}"><span class="tag">${esc(k.cat)}</span><b>${esc(k.title)}</b><span class="sub">${dt(k.createdAt)}${k.from?' · '+esc(who(k.from)):''}${ln?' · 결정: '+esc(ln.title)+(linksOf(k).length>1?' 외 '+(linksOf(k).length-1):''):''}</span></button>`}).join(''):'<p class="empty">아직 올린 자료가 없어요.</p>'}</div>
   <article class="card dview">${cur?`<div class="dhead"><div><span class="tag">${esc(cur.cat)}</span><span class="sub">${dt(cur.createdAt)}${cur.from?' · '+esc(who(cur.from))+' 올림':''}</span></div>${canEd(cur)?`<div class="dact">${cur.kind==='html'?'<button class="x" id="kfull">크게 보기</button>':`<button class="x" id="kedit">${editing?'취소':'수정'}</button>`}<button class="x" id="kdel">삭제</button></div>`:''}</div>${editing&&canEd(cur)?`<form id="kef" class="kedit"><input id="ket" value="${esc(cur.title)}" aria-label="제목" required><textarea id="keb" aria-label="내용">${esc(cur.body)}</textarea><button class="btn">저장</button></form>`:`${(()=>{const ls=linksOf(cur).map(id=>S.decisions.find(d=>d.id===id)).filter(Boolean);return (ls.length?`<p class="linked">연결된 결정 · ${ls.map(d=>`<b>${esc(d.title)}</b>`).join(' · ')}</p>`:'')+(canEd(cur)&&!editing?`<details class="lbox"><summary>결정 항목 연결하기</summary>${decChecks(S.decisions.map(normD),linksOf(cur),'kl2')}</details>`:'')})()}${cur.kind==='html'?'<iframe class="hview" id="hview" title="HTML 자료" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>':`<div class="mdv">${cur.kind==='text'?`<h1>${esc(cur.title)}</h1>`:''}${mdHtml(cur.body,cur.kind==='text')}</div>`}`}`:'<p class="empty">왼쪽에서 자료를 골라주세요.</p>'}</article>
  </section>`);
  let fileText='',fileName='';
  app.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{upMode=x.dataset.up;draw()});
  const fi=app.querySelector('#kfile');
  if(fi)fi.onchange=()=>{const f=fi.files[0];if(!f)return;if(f.size>800000){app.querySelector('#kmsg').textContent='파일이 너무 커요. 800KB 이하 파일만 올릴 수 있어요.';fi.value='';return}
    const r=new FileReader();r.onload=()=>{fileText=String(r.result);fileName=f.name;app.querySelector('#kfname').textContent=f.name;const h=upMode==='html'?fileText.match(/<title[^>]*>([^<]+)<\/title>/i):fileText.match(/^#\s+(.+)$/m);const t=app.querySelector('#kt');if(!t.value)t.placeholder=h?h[1].trim():f.name.replace(/\.[^.]+$/,'')};r.readAsText(f,'utf-8')};
  app.querySelector('#kf').onsubmit=async ev=>{ev.preventDefault();const m=app.querySelector('#kmsg');let body,kind;
    if(upMode!=='text'){if(!fileText){m.textContent='먼저 파일을 골라주세요.';return}body=fileText;kind=upMode}
    else{body=app.querySelector('#kbody').value;if(!body.trim()){m.textContent='내용을 써 주세요.';return}if(body.length>800000){m.textContent='내용이 너무 길어요.';return}kind='text'}
    const t=app.querySelector('#kt').value.trim()||app.querySelector('#kt').placeholder;
    const id=await api.addDoc({title:t,cat:app.querySelector('#kc').value,links:[...app.querySelectorAll('.kl:checked')].map(x=>x.value),body,kind,from:me.id,file:fileName});openDoc=id||openDoc;editing=false;draw()};
  const hv=app.querySelector('#hview');if(hv&&cur){hv.srcdoc=htmlDoc(cur.body);}
  const kfl=app.querySelector('#kfull');if(kfl)kfl.onclick=()=>{const v=app.querySelector('.dview');v.classList.toggle('full');kfl.textContent=v.classList.contains('full')?'작게 보기':'크게 보기'};
  const ke=app.querySelector('#kedit');if(ke)ke.onclick=()=>{editing=!editing;draw()};
  const kef=app.querySelector('#kef');if(kef)kef.onsubmit=ev=>{ev.preventDefault();editing=false;api.updateDoc(cur.id,{title:kef.querySelector('#ket').value.trim()||cur.title,body:kef.querySelector('#keb').value})};
  const kq=app.querySelector('#kq');kq.oninput=()=>{docQ=kq.value;const pos=kq.selectionStart;draw();const n=app.querySelector('#kq');n.focus();n.setSelectionRange(pos,pos)};
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{openDoc=b.dataset.k;editing=false;lboxOpen=false;draw();if(innerWidth<900)app.querySelector('.dview').scrollIntoView({behavior:'smooth'})});
  app.querySelectorAll('.kl2').forEach(c=>c.onchange=()=>{lboxOpen=true;api.updateDoc(cur.id,{links:[...app.querySelectorAll('.kl2:checked')].map(x=>x.value),link:''})});
  app.querySelectorAll('.dview .lbox').forEach(d=>{if(lboxOpen)d.open=true;d.ontoggle=()=>{lboxOpen=d.open}});
  const kd=app.querySelector('#kdel');if(kd)kd.onclick=()=>armDelete(kd,()=>{api.deleteDoc(cur.id);openDoc=null});
}

// ---------- 회원권 ----------
function member(){
  const st=S.settings,T=(st.tiers&&st.tiers.length?st.tiers:SEED_TIERS).map(t=>({...t}));
  const qty=T.reduce((a,t)=>a+(+t.qty||0),0),sold=T.reduce((a,t)=>a+(+t.sold||0),0);
  const priced=T.every(t=>+t.price>0),dep=T.reduce((a,t)=>a+(+t.price||0)*(+t.qty||0),0),depSold=T.reduce((a,t)=>a+(+t.price||0)*(+t.sold||0),0);
  const pct=qty?sold/qty*100:0;
  const od=st.openDate?new Date(st.openDate+'T00:00:00'):null,sd=st.saleDate?new Date(st.saleDate+'T00:00:00'):null;
  const today=new Date();today.setHours(0,0,0,0);
  const from=sd&&sd>today?sd:today,weeks=od?Math.max(1,Math.ceil((od-from)/(7*864e5))):null;
  const pace=weeks?Math.ceil((qty-sold)/weeks):null;
  const TCOL={Founders:'var(--c-core)',Standard:'var(--c-pr)',Premium:'var(--c-base)'};
  const inp=(i,k,v,ph,num=true)=>isAdmin()?`<input class="mi${num?' n':''}" data-ti="${i}" data-tk="${k}" value="${esc(v)}" placeholder="${ph}" ${num?'inputmode="numeric"':''} aria-label="${ph}">`:`<span${num?' class="n"':''}>${v!==''&&v!==undefined?(num?fmt(v):esc(v)):'–'}</span>`;
  shell('member',`
  <section class="grid4">
   <div class="card"><h3>목표 구좌</h3><div class="big">${fmt(qty)}<span style="font-size:15px;font-weight:600"> 구좌</span></div><div class="sub">${T.map(t=>esc(t.name)+' '+fmt(t.qty)).join(' · ')}</div></div>
   <div class="card"><h3>판매</h3><div class="big">${fmt(sold)}<span style="font-size:15px;font-weight:600"> 구좌</span></div><div class="sub">진행률 ${pct.toFixed(1)}% · 남은 ${fmt(qty-sold)}구좌</div><div class="stack">${T.map(t=>`<i style="width:${qty?(+t.sold||0)/qty*100:0}%;background:${TCOL[t.name]||'var(--oak)'}"></i>`).join('')}</div></div>
   <div class="card"><h3>보증금 총액 (목표)</h3><div class="big">${priced?fmt(dep):'<span class="kt">가격 미정</span>'}${priced?'<span style="font-size:15px;font-weight:600"> 만원</span>':''}</div><div class="sub">${priced?'판매분 '+fmt(depSold)+'만원':'등급별 보증금을 넣으면 계산돼요'}</div></div>
   <div class="card"><h3>오픈까지 필요한 판매 속도</h3><div class="big">${pace!==null?'<span class="kt">주</span> '+fmt(pace):'<span class="kt">날짜 미정</span>'}${pace!==null?'<span style="font-size:15px;font-weight:600"> 구좌</span>':''}</div><div class="sub">${pace!==null?(sd&&sd>today?'판매 시작일':'오늘')+'부터 오픈까지 '+weeks+'주 기준':'대시보드에서 오픈일을 정하면 계산돼요'}</div></div>
  </section>
  <div class="card"><div class="head"><h2>등급별 현황</h2><p class="sub">${esc(st.memberNote||'')}</p></div>
   <div style="overflow-x:auto"><table class="t mt"><thead><tr><th>등급</th><th class="n">구좌</th><th class="n">보증금 (만원/구좌)</th><th class="n">판매</th><th>진행률</th><th>혜택 메모</th></tr></thead><tbody>
   ${T.map((t,i)=>{const p=(+t.qty||0)?(+t.sold||0)/(+t.qty)*100:0;return `<tr><td><span class="dot" style="display:inline-block;background:${TCOL[t.name]||'var(--oak)'};margin-right:8px"></span><b>${esc(t.name)}</b></td>
     <td class="n">${inp(i,'qty',t.qty,'구좌')}</td><td class="n">${inp(i,'price',t.price,'미정')}</td><td class="n">${inp(i,'sold',t.sold,'0')}</td>
     <td style="min-width:160px"><div class="pbar"><i style="width:${Math.min(100,p)}%;background:${TCOL[t.name]||'var(--oak)'}"></i></div><span class="sub" style="margin:0">${p.toFixed(1)}%</span></td>
     <td>${inp(i,'benefit',t.benefit,'혜택 입력',false)}</td></tr>`}).join('')}
   </tbody><tfoot><tr><td>합계</td><td class="n">${fmt(qty)}</td><td class="n">${priced?fmt(dep)+'만원':'–'}</td><td class="n">${fmt(sold)}</td><td>${pct.toFixed(1)}%</td><td></td></tr></tfoot></table></div>
   <p class="sub" style="margin-top:10px">구좌 수는 디자인북 기획안 기준이에요. 보증금과 혜택은 확정 후 입력해요.${isAdmin()?' 칸을 눌러 바로 고칠 수 있어요.':''}</p></div>`);
  app.querySelectorAll('[data-ti]').forEach(e=>e.onchange=()=>{const i=+e.dataset.ti,k=e.dataset.tk;const v=k==='benefit'?e.value.trim():e.value.replace(/[^\d.]/g,'');T[i]={...T[i],[k]:k==='benefit'?v:(v===''?'':+v)};api.setSettings({tiers:T})});
}

// ---------- 시작 ----------
function route(){({'#plan':plan,'#content':content,'#docs':docs,'#member':member}[location.hash]||dash)()}
document.addEventListener('click',e=>{const t=e.target;if(t instanceof HTMLInputElement&&t.type==='date'&&typeof t.showPicker==='function'){try{t.showPicker()}catch(_){}}});
addEventListener('hashchange',()=>{document.getElementById('popRoot').innerHTML='';route()});
(async()=>{
  if(CFG&&CFG.firebase&&CFG.firebase.apiKey){LOCAL=false;try{api=await fireApi()}catch(e){app.innerHTML=`<div class="login card"><h1>연결 오류</h1><p class="sub">Firebase에 연결하지 못했어요. 설정 파일을 확인해 주세요.</p></div>`;return}}
  else{window.PUMAN_CONFIG=null;api=localApi()}
  route();setTimeout(()=>app.classList.remove('first'),600);
})();
}
</script>
</body>
</html>
